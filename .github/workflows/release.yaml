name: release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.event.release.tag_name }}
  IMAGE: docker.io/xachaoxizhongzhi/apinto-dashboard

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx ng build apinto --configuration production --aot
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 3

  build:
    name: build (${{ matrix.arch }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: frontend/dist/
      - name: Resolve Go dependencies
        run: go mod tidy
      - name: Test release changes
        run: go test -tags mysql ./modules/api/contract ./modules/api/service ./modules/api/controller
      - name: Build release archive
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          mkdir -p .release/package/apserver
          cp -a scripts/resource/. .release/package/apserver/
          version_package=github.com/eolinker/apinto-dashboard/app/apserver/version
          flags="-s -w -X '$version_package.Version=${VERSION#v}' -X '$version_package.gitcommit=$GITHUB_SHA' -X '$version_package.buildtime=$(date -u +%Y-%m-%dT%H:%M:%SZ)' -X '$version_package.builduser=github-actions' -X '$version_package.goversion=$(go version)'"
          CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" go build -trimpath -tags release,mysql -ldflags "$flags" -o .release/package/apserver/apserver ./app/apserver
          .release/package/apserver/apserver version
          chmod 755 .release/package/apserver/*.sh
          tar -czf ".release/apserver_${VERSION}_linux_${ARCH}.tar.gz" -C .release/package apserver
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: .release/*.tar.gz
          if-no-files-found: error
          retention-days: 3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .release/package
          file: scripts/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-${{ matrix.arch }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: Verify image entrypoint binary
        env:
          ARCH: ${{ matrix.arch }}
        run: docker run --rm --entrypoint /apserver/apserver "$IMAGE:$VERSION-$ARCH" version

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release/
          merge-multiple: true
      - name: Upload release archives and checksums
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum *.tar.gz > checksums.txt
          gh release upload "$VERSION" *.tar.gz checksums.txt --clobber
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish multi-architecture version
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Update latest for stable releases
        if: ${{ !github.event.release.prerelease }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
